version: '3.8'

services:
  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brain-neural-network
    restart: unless-stopped
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
      - DEBUG=false
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./models:/app/models
      - brain-memory:/app/memory
    ports:
      - "8000:8000"
    networks:
      - brain-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: brain-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - brain-network
    profiles:
      - monitoring

  # Optional: Add Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: brain-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - brain-network
    profiles:
      - monitoring

volumes:
  brain-memory:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  brain-network:
    driver: bridge
