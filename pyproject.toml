[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-framework"
version = "1.0.0"
description = "Comprehensive AI framework with 46+ SOTA architectures"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Brain Team", email = "brain@example.com"}
]
maintainers = [
    {name = "Brain Team", email = "brain@example.com"}
]
keywords = [
    "artificial-intelligence",
    "machine-learning",
    "deep-learning",
    "transformers",
    "computer-vision",
    "nlp",
    "multimodal",
    "AGI"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.12.0",
    "numpy>=1.21.0",
    "pyyaml>=5.4.0",
    "transformers>=4.20.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
full = [
    "transformers>=4.20.0",
    "datasets>=2.0.0",
    "accelerate>=0.20.0",
    "wandb>=0.13.0",
    "tensorboard>=2.10.0",
    "mlflow>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "torchvision>=0.13.0",
    "torchaudio>=0.12.0",
    "timm>=0.6.0",
    "einops>=0.6.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    "matplotlib>=3.5.0",
    "Pillow>=9.0.0",
]

data = [
    "datasets>=2.0.0",
    "torchvision>=0.13.0",
    "torchaudio>=0.12.0",
    "Pillow>=9.0.0",
]

models = [
    "transformers>=4.20.0",
    "timm>=0.6.0",
    "einops>=0.6.0",
]

training = [
    "accelerate>=0.20.0",
    "deepspeed>=0.9.0",
    "lightning>=2.0.0",
]

monitoring = [
    "wandb>=0.13.0",
    "tensorboard>=2.10.0",
    "mlflow>=2.0.0",
]

api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
]

scientific = [
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    "matplotlib>=3.5.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/Brain"
Documentation = "https://github.com/yourusername/Brain/docs"
Repository = "https://github.com/yourusername/Brain"
"Bug Tracker" = "https://github.com/yourusername/Brain/issues"

[project.scripts]
brain = "cli.main:main"
brain-train = "cli.commands.train:main"
brain-eval = "cli.commands.evaluate:main"
brain-serve = "cli.commands.serve:main"

[tool.setuptools]
packages = { find = { exclude = ["tests*", "examples*", "docs*"] } }

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=brain --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["brain", "architectures", "core", "utils"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
